# Open WebUI with pi-outpost's Open WebUI server, ready for a demo or a first install.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d     # Open WebUI on http://<host>:3000
#
# pi-outpost's server is reachable from Open WebUI only: it publishes no port.
# See docs/openwebui.md.
name: openwebui-pi-outpost

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.11.4}
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      # The model provider (any OpenAI-compatible API). Several: separate with ";".
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:?set OPENAI_API_BASE_URLS in .env}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:?set OPENAI_API_KEYS in .env}
      ENABLE_OLLAMA_API: "false"
      # Who is asking: Open WebUI signs the user into every tool call.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      FORWARD_USER_INFO_HEADER_JWT_SECRET: ${OUTPOST_IDENTITY_KEY:?set OUTPOST_IDENTITY_KEY in .env}
      # pi-outpost's server, declared as a global tool server open to every user (with
      # no access_grants, Open WebUI keeps it to admins). Read at first start;
      # afterwards Admin Settings → Integrations → External Tool Servers holds it.
      TOOL_SERVER_CONNECTIONS: >-
        [{"url": "http://pi-outpost:8790", "path": "openapi.json", "type": "openapi",
          "auth_type": "bearer", "key": "${OUTPOST_SECRET:?set OUTPOST_SECRET in .env}",
          "config": {"enable": true,
                     "access_grants": [{"principal_type": "user", "principal_id": "*", "permission": "read"}]},
          "info": {"id": "pi-outpost", "name": "pi-outpost",
                   "description": "Personal plannings, diagrams, sequences and tables, drawn in the chat"}}]
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - pi-outpost

  pi-outpost:
    # Published with each pi-outpost release. To run an unreleased version, build it from
    # a clone (docker build -f openwebui/Dockerfile -t pi-outpost-openwebui .) and set
    # OUTPOST_IMAGE=pi-outpost-openwebui in .env.
    image: ${OUTPOST_IMAGE:-ghcr.io/laurentftech/pi-outpost-openwebui:latest}
    restart: unless-stopped
    environment:
      OUTPOST_SECRET: ${OUTPOST_SECRET}
      OUTPOST_IDENTITY_KEY: ${OUTPOST_IDENTITY_KEY}
    volumes:
      - pi-outpost-data:/data

volumes:
  open-webui:
  pi-outpost-data:
