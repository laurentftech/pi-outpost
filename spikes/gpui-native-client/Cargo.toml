[package]
name = "pi-outpost-gpui-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures-util = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
