name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspace @pi-outpost/embed
      - run: npm run lint

      - run: npm test --workspace server
        env:
          CI: true

      # Coverage on one platform only, and over the unit suites alone. The .mjs
      # suites drive a real server in a subprocess: its coverage is not ours to
      # claim, and loading them all made node truncate its own report at 10 MB.
      # Windows runs nothing instrumented, so a coverage tool cannot turn that leg red.
      #
      # src/embeddedRuntime.ts is excluded too: it is a thin adapter over the pi SDK's
      # AgentSession (every method delegates), exercised only by the .mjs suites above.
      # Its sole caller (src/index.ts) is already excluded, but node's coverage
      # instruments it non-deterministically when it appears in the transitive import
      # graph — pulling ~49 uncovered functions into a total the unit suites cannot reach.
      - run: npm run test:coverage --workspace server
        if: matrix.os == 'ubuntu-latest'
        env:
          CI: true
      - run: npm run test:coverage --workspace ui
        if: matrix.os == 'ubuntu-latest'
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: node scripts/coverage-summary.mjs server=server/coverage/lcov.info ui=ui/coverage/lcov.info
      - name: Keep the coverage for the badge job
        if: matrix.os == 'ubuntu-latest' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            server/coverage/lcov.info
            ui/coverage/lcov.info
          retention-days: 1

      - run: npm test --workspace ui
        if: matrix.os != 'ubuntu-latest'

      - run: npm run build
      # A stylesheet can build cleanly and style nothing (#38) — check the artifact.
      - run: npm run check:css
      # An embed package can build cleanly and be unusable: a missing entry point,
      # or a second React bundled in. Both are invisible until someone installs it.
      - run: npm run check:embed

      # A change can declare scenarios nobody ever wrote a test for and stay green
      # everywhere: the suite passes, the coverage percentage holds, and the only
      # thing that would have caught it is a person reading the delta specs beside
      # the tests. This checks the mechanical half — every scenario is accounted
      # for in the change's scenario-coverage.md, and every file it cites exists.
      # Scoped to the changes this branch touches, so an older change without a
      # matrix does not fail unrelated work.
      - run: npm run test:scripts
        if: matrix.os == 'ubuntu-latest'
      - name: Spec scenarios are accounted for
        if: matrix.os == 'ubuntu-latest'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          node scripts/check-scenario-coverage.mjs --base FETCH_HEAD

  # The two ways this project is consumed, in a real browser: the app the server
  # serves, and the widget a host page mounts. Shadow DOM, cross-origin wiring and
  # an actually-applied stylesheet are all invisible to jsdom, which is where the
  # 847 UI tests run. Its own job: it needs a browser the other legs do not, and
  # running in parallel keeps it off the critical path.
  browser:
    runs-on: ubuntu-latest
    # Chromium and the twenty-odd system libraries it needs are already in this
    # image. Installing them per run took eleven minutes against a job whose real
    # work — checkout, install, build, the suite — takes about one, and it did it
    # on every pull request.
    #
    # The tag pins the Playwright version, so it has to move with the dependency:
    # a browser older or newer than the client that drives it fails at launch, and
    # fails confusingly. The step below refuses the job when the two drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Install build tools for native addons
        run: apt-get update && apt-get install -y build-essential
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The image must carry the Playwright this repo installs
        run: |
          image=$(grep -om1 'mcr.microsoft.com/playwright:v[0-9.]*' .github/workflows/ci.yml | sed 's/.*:v//')
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$image" != "$installed" ]; then
            echo "::error::container image is Playwright $image, package.json installs $installed — bump the image tag"
            exit 1
          fi
          echo "Playwright $installed, browsers from the image at $PLAYWRIGHT_BROWSERS_PATH"
      # web/dist is what the server serves, embed/dist is what the host page imports
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # The badge, drawn and pushed here rather than by a marketplace action: this is
  # the only job that may write to the repository, and nothing outside it runs.
  # Main only — a badge is a claim about the shipped branch.
  badge:
    needs: check
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One badge writer at a time: two pushes landing together would race on gh-pages.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage-artifact
      - run: node scripts/coverage-badge.mjs badge/coverage.svg coverage-artifact/server/coverage/lcov.info coverage-artifact/ui/coverage/lcov.info
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # An orphan branch holding only the badge: no history of the code, nothing
          # to review, and a force-free push because it is rebuilt from empty.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p badges
          mv badge/coverage.svg badges/coverage.svg
          git add badges/coverage.svg
          # Nothing to say when the figure has not moved
          git diff --staged --quiet || git commit -m 'chore(badge): coverage [skip ci]'
          git push origin gh-pages
