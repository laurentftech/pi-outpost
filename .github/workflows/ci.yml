name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Does this pull request change anything a test could see? A documentation-only PR
  # skips the jobs below and is judged by `CI ok` in about a minute; anything else runs
  # all of them. A push to main always runs everything: the coverage badge and Scorecard
  # read main.
  #
  # Documentation only means: the Markdown files at the root listed below, the issue and
  # PR templates, and files under docs/ that no other file names. Some docs/ pages are
  # contracts — tests validate their examples, the CLI build copies them into the package
  # — and the tests and build name them by their full repository path. So a docs/ file
  # whose path appears anywhere outside Markdown and docs/ itself counts as code. A test
  # that reads a docs/ file must therefore spell its path in full, as the quality guide
  # says; and this comment avoids spelling any, so as not to claim a page by mention.
  # A mention in a code comment or a user-facing link also counts: slower, never unsafe.
  # Everything not matched, openspec/, skills/ and CHANGELOG.md included, runs the full CI.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "not a pull request: full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rename lists both names: the old path matters as much as the new one.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            -q '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files"
          # The listing stops at 3000 files; a PR that size is not documentation.
          if [ "$(wc -l < "$RUNNER_TEMP/files")" -ge 3000 ]; then
            echo "too many files to list: full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              README.md|CONTRIBUTING.md|SECURITY.md|GOVERNANCE.md|CODE_OF_CONDUCT.md|CLAUDE.md|AGENTS.md) continue ;;
              .github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) continue ;;
              docs/*)
                if git grep -qF -- "$file" -- ':!*.md' ':!docs/'; then
                  echo "$file is named by: $(git grep -lF -- "$file" -- ':!*.md' ':!docs/' | tr '\n' ' ')"
                  code=true
                fi
                ;;
              *)
                echo "$file is not documentation"
                code=true
                ;;
            esac
          done < "$RUNNER_TEMP/files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then echo "documentation only: the test jobs are skipped"; fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A healthy run takes under fifteen minutes on either platform, Windows being the
    # slower. Without a ceiling a hang is not a failure, it is six hours: GitHub's own
    # limit is what finally cancelled a coverage run whose tests had all reported and
    # whose process never exited, with an orphaned `bash` still alive underneath it.
    # Thirty minutes is twice the slowest healthy run — enough that a slow runner is
    # not mistaken for a stuck one, short enough that a stuck one says so the same
    # afternoon. It bounds the cost; it does not explain the hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Use the pinned npm
        uses: ./.github/actions/setup-npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --workspace @pi-outpost/embed
      - run: npm run lint
      - name: Extension theme and packaged server regressions
        run: node --import tsx/esm --test --test-timeout=300000 server/test/extensionUiBridge.test.ts server/test/extensionUiBridgeBundled.test.mjs server/test/versionsBundled.test.mjs

      # The confined terminal's real test needs landstrip's runner, and only Linux confines.
      # Fetched rather than depended on: the package is platform-specific, and nothing
      # pi-outpost ships needs it.
      # The version the Docker image ships (deploy/docker/Dockerfile): the network checks under
      # sandbox.allowedHosts prove the runner users run. It is an AppImage, extracted since the
      # runner has no FUSE, and it creates user namespaces, which Ubuntu 24.04's AppArmor refuses
      # to a process without a profile: the host setting docs/sandboxing.md documents, as in mxc-linux.
      - name: landstrip runner for the confined-terminal and network tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cd "$RUNNER_TEMP"
          npm pack --silent @landstrip/landstrip-linux-x64@0.20.26
          mkdir landstrip && tar xzf landstrip-landstrip-linux-x64-0.20.26.tgz -C landstrip
          (cd landstrip && ./package/bin/landstrip --appimage-extract > /dev/null)
          echo "LANDSTRIP_BIN=$RUNNER_TEMP/landstrip/squashfs-root/usr/bin/landstrip" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/landstrip/squashfs-root/usr/bin/landstrip" doctor

      # On Ubuntu the server suites run once, instrumented: every suite, unit and integration,
      # including the servers the integration suites start. Their coverage is reported with the
      # UI's further down. Windows runs them uninstrumented: there the harness ends a server
      # with taskkill /F, which leaves it no exit to write coverage on.
      - run: npm test --workspace server
        if: matrix.os != 'ubuntu-latest'
        env:
          CI: true
      - run: npm run test:coverage --workspace server
        if: matrix.os == 'ubuntu-latest'
        env:
          CI: true

      - run: npm test --workspace @pi-outpost/openwebui

      # The Word and PowerPoint builders, and Mermaid drawn without a browser.
      - run: npm test --workspace @pi-outpost/office

      # Posters: the page format, its guide and the Word and PowerPoint packaging.
      - run: npm test --workspace @pi-outpost/posters

      # The MCP App for Claude Desktop: its tools, then the .mcpb a person installs,
      # unpacked and started over stdio as the host starts it — on both platforms it
      # declares.
      - run: npm test --workspace @pi-outpost/mcp
      - run: npm run pack --workspace @pi-outpost/mcp
      - run: npm run test:bundle --workspace @pi-outpost/mcp

      # pi-outpost's Open WebUI server as deployments run it: the image, its volume,
      # its refusal to start without a secret.
      - name: Open WebUI server image
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -f openwebui/Dockerfile -t pi-outpost-openwebui:dev .
          bash openwebui/test/image.sh pi-outpost-openwebui:dev

      # UI coverage, Ubuntu only, over ui/src and the shared/src code the UI's tests run.
      - run: npm run test:coverage --workspace ui
        if: matrix.os == 'ubuntu-latest'
      # Both sides' raw coverage, merged by one converter over server/src, shared/src and
      # ui/src (scripts/coverage-config.mjs): a shared file is credited by every suite that
      # runs it, a file no test loads counts at 0%. Fails below a scope's thresholds.
      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/coverage-report.mjs
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: node scripts/coverage-summary.mjs coverage/coverage-scopes.json
      # Kept on every run, so a pull request's per-file figures can be read; the badge job
      # uses it on main only.
      - name: Keep the coverage for the badge job
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/coverage-scopes.json
          retention-days: 1

      - run: npm test --workspace ui
        if: matrix.os != 'ubuntu-latest'

      - run: npm run build
      # A stylesheet can build cleanly and style nothing (#38) — check the artifact.
      - run: npm run check:css
      # An embed package can build cleanly and be unusable: a missing entry point,
      # or a second React bundled in. Both are invisible until someone installs it.
      - run: npm run check:embed

      # A change can declare scenarios nobody ever wrote a test for and stay green
      # everywhere: the suite passes, the coverage percentage holds, and the only
      # thing that would have caught it is a person reading the delta specs beside
      # the tests. This checks the mechanical half — every scenario is accounted
      # for in the change's scenario-coverage.md, and every file it cites exists.
      # Scoped to the changes this branch touches, so an older change without a
      # matrix does not fail unrelated work.
      - run: npm run test:scripts
        if: matrix.os == 'ubuntu-latest'
      - name: Spec scenarios are accounted for
        if: matrix.os == 'ubuntu-latest'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          node scripts/check-scenario-coverage.mjs --base FETCH_HEAD

  npm-install:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Use the pinned npm
        uses: ./.github/actions/setup-npm
      - run: npm ci --foreground-scripts
      - run: npm run build --workspace cli
      - run: npm run test:npm-install

  # The two ways this project is consumed, in a real browser: the app the server
  # serves, and the widget a host page mounts. Shadow DOM, cross-origin wiring and
  # an actually-applied stylesheet are all invisible to jsdom, which is where the
  # 847 UI tests run. Its own job: it needs a browser the other legs do not, and
  # running in parallel keeps it off the critical path.
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS, not a Playwright container on Linux. There node-pty has no prebuilt binary, so
    # every run compiled it, with a compiler apt-get fetched first — and when Ubuntu's
    # mirrors stopped resolving from the container (2026-11-11), the job failed before a
    # single test, on every branch. Here node-pty ships prebuilt and the browsers need no
    # system libraries. They are installed by the Playwright this repository locks, so the
    # two cannot drift apart as an image tag could. Linux still runs every server suite,
    # terminal included, in `check`.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Use the pinned npm
        uses: ./.github/actions/setup-npm
      # node-pty is optional for users, but this job must exercise the terminal.
      - run: npm ci --foreground-scripts
      - name: Native terminal binding loads
        run: node -e "require('node-pty')"
      - name: The Playwright this repository locks
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Keyed by that version: a new Playwright downloads the browsers it drives.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit
      # web/dist is what the server serves, embed/dist is what the host page imports
      - run: npm run build
      - name: Capture extension status colours
        run: npm run test:e2e -- e2e/extension-status-colours.spec.ts
        env:
          CI: true
      - name: Keep status colour previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: status-colour-previews
          path: e2e/test-results/**/status-*.png
          retention-days: 7
      - run: npm run test:e2e
        env:
          CI: true
      - name: Cross-browser and accessibility bench
        run: npm run test:webbench
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-reports
          path: |
            e2e/test-results/
            e2e/test-results-webbench/
          retention-days: 7

  # MXC's Linux executor (lxc-exec, Bubblewrap) in the shape docs/sandboxing.md documents:
  # a Docker container, refused under Docker's default profile with MXC's reason, confined
  # under the documented flags. Unit tests cannot see what these runs found — a /proc mount
  # refused under masked system paths, a missing `ip`, the wrong process read for the
  # terminal's directory — so they run on every pull request, from the same script a
  # developer runs (scripts/mxc-linux/test.sh). Its own job: Docker, not the suites' node.
  mxc-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner is Ubuntu 24.04: AppArmor refuses unprivileged user namespaces to any
      # process without a profile allowing them, container or not. The host setting
      # docs/sandboxing.md tells an Ubuntu deployment to make, on an ephemeral host.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash scripts/mxc-linux/test.sh

  # macOS' sandbox runners on a real Mac: Seatbelt through sandbox-exec, and MXC's mxc-exec-mac,
  # which ships for Apple silicon only — which macos-latest is and no developer machine here is.
  # The same script a developer on a Mac runs (scripts/mxc-macos/test.sh); these tests skip elsewhere.
  mxc-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Use the pinned npm
        uses: ./.github/actions/setup-npm
      - run: npm ci --workspace server --workspace shared --workspace office --include-workspace-root=false
      - run: bash scripts/mxc-macos/test.sh

  # The one check the branch rules require, so the required list never has to follow the
  # jobs above. A skipped matrix job reports no "check (ubuntu-latest)" at all, which a
  # rule naming it would wait on forever; this job always reports. It passes when every
  # job passed or was skipped as documentation-only, and fails on any failure or
  # cancellation — or if the classification itself did not succeed.
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, check, npm-install, browser, mxc-linux, mxc-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped as documentation-only
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.result == "success"
            and all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # The badge, drawn and pushed here rather than by a marketplace action: this is
  # the only job that may write to the repository, and nothing outside it runs.
  # Main only — a badge is a claim about the shipped branch.
  #
  # The README reads it straight from the branch, through raw.githubusercontent.com
  # (served as image/svg+xml, which GitHub's image proxy needs) — not through GitHub
  # Pages, which publishes the project site from main:/docs and no longer serves
  # gh-pages. Pointing Pages elsewhere again cannot take the badge with it.
  badge:
    needs: check
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One badge writer at a time: two pushes landing together would race on gh-pages.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage-artifact
      - run: node scripts/coverage-badge.mjs badge/coverage.svg coverage-artifact/coverage-scopes.json
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # An orphan branch holding only the badge: no history of the code, nothing
          # to review, and a force-free push because it is rebuilt from empty.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p badges
          mv badge/coverage.svg badges/coverage.svg
          git add badges/coverage.svg
          # Nothing to say when the figure has not moved
          git diff --staged --quiet || git commit -m 'chore(badge): coverage [skip ci]'
          git push origin gh-pages
