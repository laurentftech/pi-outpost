# ClusterFuzzLite on pull requests: fuzz the parsers of untrusted input a change touches, for a
# few minutes each (docs/development.md § Fuzzing). A crash fails the job and is reported in it.
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    paths:
      - server/src/mail*.ts
      - office/src/zip.ts
      - shared/src/structuredExchange*.ts
      - shared/schemas/**
      - fuzz/**
      - .clusterfuzzlite/**
      - .github/workflows/cflite-pr.yml
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Build the fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          # The action accepts address, memory, undefined or coverage; Jazzer.js uses none of them
          # (OSS-Fuzz skips its sanitizer checks for JavaScript), so this only satisfies the action.
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fuzz what the change touches
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          # The action accepts address, memory, undefined or coverage; Jazzer.js uses none of them
          # (OSS-Fuzz skips its sanitizer checks for JavaScript), so this only satisfies the action.
          sanitizer: address
          mode: code-change
          fuzz-seconds: 300
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the crashing input
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzing-artifacts
          path: ./out/artifacts
          if-no-files-found: ignore
