# ClusterFuzzLite on main, daily: every fuzz target for longer than a pull request allows
# (docs/development.md § Fuzzing). A crash fails the run and is reported in its log.
name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Build the fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          sanitizer: none
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fuzz every target
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: javascript
          sanitizer: none
          mode: batch
          fuzz-seconds: 3600
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the crashing input
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzing-artifacts
          path: ./out/artifacts
          if-no-files-found: ignore
