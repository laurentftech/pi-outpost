# Fuzzing on main, daily: every fuzz target with Jazzer.js for longer than a pull request allows
# (docs/development.md § Fuzzing). A finding fails the run, names the target in an annotation
# and keeps the crashing input as an artifact.
#
# Jazzer.js runs directly: ClusterFuzzLite's actions cannot fuzz JavaScript (see fuzz/run.mjs).
name: Fuzzing (daily)

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Use the pinned npm
        uses: ./.github/actions/setup-npm
      # Only esbuild and the targets' pure-JavaScript dependencies are needed: no install script runs.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node fuzz/build.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: fuzz
      # An hour in all: twenty minutes per target.
      - name: Fuzz every target
        run: node fuzz/run.mjs 1200
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzing-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
