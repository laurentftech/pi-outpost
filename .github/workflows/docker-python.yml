name: Docker app with Python

on:
  pull_request:
    paths:
      - deploy/docker/**
      - docs/docker.md
      - .github/workflows/docker-python.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Use npm 12.2.1
        run: npm install -g npm@12.2.1
      # Only the browser client is needed on the host; the app and its native
      # dependencies are installed and exercised inside the Docker image.
      - run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build the full application image
        run: |
          docker build --build-arg APP_UID="$(id -u)" --build-arg APP_GID="$(id -g)" \
            -t pi-outpost-python:0.59.1 deploy/docker
      - name: Exercise the installed app, confinement, terminal and persistence
        run: node deploy/docker/test.mjs
      - name: Diagnose namespace requirements on a failed recipe
        if: failure()
        shell: bash
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          for probe_mode in default seccomp namespaces proc; do
            probe_args=(--rm --cap-drop=ALL --security-opt=no-new-privileges)
            case "$probe_mode" in
              seccomp|namespaces|proc) probe_args+=(--security-opt=seccomp=unconfined) ;;
            esac
            case "$probe_mode" in
              namespaces|proc) probe_args+=(--security-opt=apparmor=unconfined) ;;
            esac
            if [ "$probe_mode" = proc ]; then probe_args+=(--security-opt=systempaths=unconfined); fi
            echo "Namespace diagnostic: $probe_mode"
            docker run "${probe_args[@]}" --entrypoint /opt/landstrip/bin/landstrip \
              pi-outpost-python:0.59.1 doctor || true
          done
