name: Docker app with Python

on:
  pull_request:
    paths:
      - deploy/docker/**
      - docs/docker.md
      - .github/workflows/docker-python.yml
      - .github/workflows/release.yml
      - scripts/image-tags*
      # The confinement the image's runner applies, built into the CLI it installs.
      - server/src/egressProxy.ts
      - server/src/terminalSandbox.ts
      - server/src/confinedBash.ts
      - server/src/config.ts
      - server/src/sandboxGrants.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pi-outpost-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the dedicated AppArmor profile
        run: sudo apparmor_parser -r deploy/docker/profiles/pi-outpost-landstrip.apparmor
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Use the pinned npm
        uses: ./.github/actions/setup-npm
      # The CLI is built from this branch and packed as the release packs it: the recipe and the
      # app it installs move together (the bootstrap writes configuration this CLI must accept).
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Build the full application image
        run: |
          version=$(node -p "require('./cli/package.json').version")
          npm pack --workspace cli --ignore-scripts --pack-destination deploy/docker --silent
          mv deploy/docker/pi-outpost-*.tgz deploy/docker/pi-outpost.tgz
          docker build --build-arg PI_OUTPOST_VERSION="$version" --build-arg PI_OUTPOST_PACKAGE=/recipe/pi-outpost.tgz \
            -t "pi-outpost-python:$version" deploy/docker
          echo "PI_OUTPOST_TEST_VERSION=$version" >> "$GITHUB_ENV"
          echo "PI_OUTPOST_TEST_IMAGE=pi-outpost-python:$version" >> "$GITHUB_ENV"
      - name: Exercise the installed app, confinement, terminal and persistence
        env:
          LANDSTRIP_APPARMOR_PROFILE: pi-outpost-landstrip
        run: sudo --preserve-env=LANDSTRIP_APPARMOR_PROFILE,PLAYWRIGHT_BROWSERS_PATH,PI_OUTPOST_TEST_VERSION,PI_OUTPOST_TEST_IMAGE "$(command -v node)" deploy/docker/test.mjs
