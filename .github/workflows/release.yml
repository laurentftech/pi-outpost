name: Release

# Publishes on a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag is the trigger *and* the version claim — the job refuses to publish if it
# disagrees with what the packages say about themselves.
on:
  push:
    tags: ["v*"]
  # The executables are the half of this pipeline that cannot be judged from a
  # laptop: they are per-platform by nature, and a runtime whose single-executable
  # support is broken builds them happily and crashes on the first invocation. This
  # runs the matrix from any branch, without publishing anything.
  workflow_dispatch:
    inputs:
      executables_only:
        description: "Build the executables and stop (no npm publish)"
        type: boolean
        default: true

permissions:
  # The executables are uploaded to the release this tag created.
  contents: write
  # The OIDC token GitHub mints for this workflow. npm's trusted publisher for both
  # packages names this repo and this file, so the token *is* the credential: no
  # NPM_TOKEN, nothing to steal from the repo's secrets, and provenance is attested
  # from it automatically.
  id-token: write

jobs:
  # One executable per platform, built on that platform: a single-file executable
  # carries a runtime, and a runtime is not cross-buildable. They gate the publish
  # rather than following it — a version on npm whose release page has nothing to
  # download is worse than a release that stopped.
  executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # No Intel macOS build. `macos-13` was the last x64 label and GitHub has
          # retired it: a job requesting it does not fail, it queues until the 24h
          # timeout — which would hang `publish`, since the publish waits on this
          # matrix. `macos-15-intel` is the successor label and is worth adding
          # once someone has watched a job actually start on it; queuing forever is
          # not a thing to discover on a tag.
          - runner: ubuntu-latest
            arch: x64
          - runner: windows-latest
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 26 and not the version the rest of the pipeline uses: --build-sea is
          # what produces an executable, and it landed in 26.
          node-version: 26
          cache: npm
      - run: npm ci
      # The executable inlines the built web UI, so the UI has to exist first
      - run: npm run build

      - name: Build the executable
        shell: bash
        run: |
          version=$(node -p "require('./cli/package.json').version")
          os=$(node -p "process.platform === 'win32' ? 'windows' : process.platform === 'darwin' ? 'macos' : 'linux'")
          name="pi-outpost-$version-$os-${{ matrix.arch }}"
          [ "$os" = "windows" ] && name="$name.exe"
          node --import tsx/esm server/src/index.ts build-exe --out "$name" --force
          echo "ARTIFACT=$name" >> "$GITHUB_ENV"

      # build-exe already refuses to report success for an executable that does not
      # run — it invokes the result before printing a path. This asserts the other
      # half: that what runs is *this* version, not a stale bundle picked up by
      # accident.
      - name: It reports the version being released
        shell: bash
        run: |
          printed=$("./$ARTIFACT" --version)
          expected=$(node -p "require('./cli/package.json').version")
          if [ "$printed" != "$expected" ]; then
            echo "::error::the executable reports $printed, the tag says $expected"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  publish:
    needs: executables
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      # Node 24 for the tests and the lint — the same version CI runs, so a suite
      # that passed on a pull request is the suite this job runs.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Dependencies first, with the npm this Node ships.
      #
      # The upgrade below used to run before this line, and it cost a release.
      # npm 12 blocks a dependency's install scripts by default (allowScripts), and
      # `node-pty` publishes prebuilds for darwin and win32 only — on Linux it has to
      # compile at install time. Blocked, it installs with no binary at all, and the
      # four TerminalManager tests that spawn a real PTY fail with "Cannot find module
      # './prebuilds/linux-x64//pty.node'". The same command passes in CI, which never
      # replaces its npm, so nothing before the tag ever showed it.
      - run: npm ci

      # Trusted publishing (OIDC) needs npm >= 11.5.1. It is wanted for `npm publish`
      # and for nothing else, so it goes after the install rather than before it.
      - run: npm install -g npm@latest

      # A tag claims a version; at least one package must actually be at it, and none
      # may disagree with it.
      - name: Tag must match the packages it releases
        id: plan
        run: |
          tag="${GITHUB_REF_NAME#v}"
          publish=""
          matched=""
          for pkg in cli embed; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" = "$tag" ]; then
              matched="$matched $pkg"
              name=$(node -p "require('./$pkg/package.json').name")
              if npm view "$name@$tag" version > /dev/null 2>&1; then
                echo "$name@$tag is already on npm — skipping"
              else
                publish="$publish $pkg"
              fi
            fi
          done
          if [ -z "$matched" ]; then
            echo "::error::no package is at version $tag"
            exit 1
          fi
          if [ -z "$publish" ]; then
            echo "All matching packages are already on npm — continuing to repair or refresh the GitHub Release"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Tests et Lint en Node 22
      - run: npm run typecheck
      - run: npm run build --workspace @pi-outpost/embed
      - run: npm run lint
      - run: npm test --workspace server
      - run: npm test --workspace ui
      - run: npm run build
      # 0.6.6 shipped unstyled; never publish that again.
      - run: npm run check:css
      # Never publish a package whose entry points resolve to nothing, or that
      # carries its own React into a host page that already has one.
      - run: npm run check:embed

      # The browser smoke test runs on every PR too. Repeated here because this is
      # the last gate before the artifact becomes someone else's dependency, and
      # the widget's integration surface — Shadow DOM, cross-origin — is exactly
      # what a consumer meets first.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true

      # BASCULE vers Node 26 pour le build du blob SEA (--build-sea + mainFormat:module)
      - name: Setup Node 26 for SEA build
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # Build the SEA blob (Node 26, --experimental-sea-config pour le blob cross-platform)
      - run: npm run build:sea --workspace server

      # Copy the SEA blob into the npm package so it ships with cli/dist/
      - run: cp server/dist/sea-prep.blob cli/dist/sea-prep.blob

      # The tarball must carry what `pi-outpost build-exe` reads. The blob arrives by
      # the copy above rather than from the cli build, so nothing before this point has
      # seen the package as it will be published: a missing build:sea step, or a `files`
      # entry that stopped covering dist/, both land here and nowhere earlier.
      - run: npm run check:cli

      # Le publish peut se faire en Node 24 sans problème.
      #
      # The dist-tag comes from the version, never from an input: a release that
      # reached `beta`, or a beta that reached `latest`, would both be one forgotten
      # checkbox away. And `latest` is the tag the update check reads, so moving it
      # onto a prerelease offers that prerelease to every existing installation.
      - name: Publish
        run: |
          channel=$(node scripts/release-channel.mjs "${GITHUB_REF_NAME#v}")
          echo "publishing to the $channel channel"
          for pkg in ${{ steps.plan.outputs.publish }}; do
            npm publish --workspace "$pkg" --tag "$channel"
          done

  # Attached after publish, from the artifacts the matrix already proved runnable.
  attach:
    needs: [executables, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job downloads artifacts and nothing else, so it had no working copy —
      # and the rule deciding whether this tag is a prerelease lives in one.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: executables
          merge-multiple: true
      - name: Create the release if needed and attach the executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same derivation as the npm channel, from the same version. Two
          # independent decisions about one version is how a release ends up
          # published as a prerelease and displayed as the current one.
          channel=$(node scripts/release-channel.mjs "${GITHUB_REF_NAME#v}")
          prerelease=""
          if [ "$channel" != "latest" ]; then prerelease="--prerelease"; fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              $prerelease \
              --title "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
          # This job is rerun to repair a release, and a rerun skips the create above —
          # so the flag would never reach a release that already exists and is marked
          # wrongly. Stated every time instead of only at creation.
          if [ -n "$prerelease" ]; then
            gh release edit "$GITHUB_REF_NAME" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$GITHUB_REF_NAME" executables/* --clobber --repo "$GITHUB_REPOSITORY"
