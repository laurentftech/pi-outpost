name: Diagnose Windows command cleanup
on:
  push:
    branches: [fix/windows-aborted-command-cleanup]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Concurrent command cancellation stress
        run: node server/test/fixtures/stress-queued-cleanup.mjs
      - run: npm run build --workspace @pi-outpost/embed
      - name: Full server suite with process diagnostics
        run: npm test --workspace server
        env:
          CI: true
